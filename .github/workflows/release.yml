name: Release

# Publishes to npm when a vX.Y.Z tag is pushed, via npm trusted publishing (OIDC): no token
# is stored. One-time setup on npmjs.com: package settings → Trusted publisher → GitHub
# Actions, this repository, workflow file `release.yml`.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Tag matches package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: npm test
      - run: npm publish --provenance --access public
